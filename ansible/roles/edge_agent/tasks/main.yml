- name: Confere o token
  ansible.builtin.debug:
    msg: "Token: {{ edge_agent_token }}"

- name: Instala o agente
  ansible.builtin.shell: cp edge-agent.sh /usr/local/bin/edge-agent && chmod 755 /usr/local/bin/edge-agent

- name: Cria os diretórios
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/edge-agent
    - "{{ edge_agent_state_dir }}"

- name: Configura o agente
  ansible.builtin.template:
    src: edge-agent.conf.j2
    dest: /etc/edge-agent/edge-agent.conf
    owner: root
    group: root
    mode: 644

- name: Instala a unit
  ansible.builtin.copy:
    src: edge-agent.service
    dest: /etc/systemd/system/edge-agent.service
    owner: root
    group: root
    mode: "0644"

- name: Sobe o agente
  ansible.builtin.systemd:
    name: edge-agent
    state: started
    enabled: true
  ignore_errors: true
