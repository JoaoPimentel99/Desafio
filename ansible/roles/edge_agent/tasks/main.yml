- name: Confere se o token foi informado
  ansible.builtin.assert:
    that:
      - edge_agent_token | length > 0
    fail_msg: "Defina EDGE_AGENT_TOKEN no ambiente do controlador."

- name: Instala o agente
  ansible.builtin.copy:
    src: edge-agent.sh
    dest: /usr/local/bin/edge-agent
    owner: root
    group: root
    mode: "0755"
  notify: Reinicia o agente

- name: Cria os diretórios
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/edge-agent
    - "{{ edge_agent_state_dir }}"

- name: Configura o agente
  ansible.builtin.template:
    src: edge-agent.conf.j2
    dest: /etc/edge-agent/edge-agent.conf
    owner: root
    group: root
    mode: "0600"
  notify: Reinicia o agente
  no_log: true

- name: Instala a unit
  ansible.builtin.copy:
    src: edge-agent.service
    dest: /etc/systemd/system/edge-agent.service
    owner: root
    group: root
    mode: "0644"
  notify: Reinicia o agente

- name: Sobe o agente
  ansible.builtin.systemd:
    name: edge-agent
    state: started
    enabled: true
    daemon_reload: true

- name: Confirma que o agente continua rodando
  ansible.builtin.service_facts:
  register: edge_agent_services
  until: edge_agent_services.ansible_facts.services['edge-agent.service'].state == 'running'
  retries: 5
  delay: 3
