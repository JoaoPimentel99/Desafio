- name: Desliga login de root e por senha
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-edge-hardening.conf
    owner: root
    group: root
    mode: "0644"
    #
    #
  content: |
    # Gerenciado pelo Ansible
    PermitRootLogin no
    PasswordAuthentication no
  validate: sshd -t -f %s
when: ansible_facts['distribution'] == 'Ubuntu'
notify: Reinicia o ssh
